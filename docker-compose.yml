services:
  luiza-db:
    image: postgres:16.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: luiza
      POSTGRES_PASSWORD: luiza
      POSTGRES_DB: luiza
    ports:
      - "5437:5432"
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luiza -d luiza"]
      interval: 5s
      timeout: 5s
      retries: 10

  luiza-sqitch-migrate:
    image: sqitch/sqitch:latest
    working_dir: /sqitch
    volumes:
      - ./sqitch:/sqitch
      - ./data:/data
      - ./uploads:/uploads
    command: >
      deploy --verify
      --target db:pg://luiza:luiza@luiza-db:5432/luiza
    depends_on:
      luiza-db:
        condition: service_healthy
    restart: "no"

  luiza-app:
    build: .
    volumes:
      - .:/app
      - ./data:/data
      - ./uploads:/uploads
    depends_on:
      luiza-sqitch-migrate:
        condition: service_completed_successfully
    ports:
      - "8777:5000"
    environment:
      FLASK_APP: app
      FLASK_SETTINGS: /app/etc/settings_docker.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    command: >
      sh -c "
      poetry config installer.max-workers 10 &&
      poetry install --no-interaction --no-ansi &&
      poetry run flask run -h 0.0.0.0 -p 5000 --debug --reload
      "